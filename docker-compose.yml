services:
  backend:
    build: .
    container_name: grottocenter-ai-backend
    command: uvicorn backendV2.main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      - API_HOST=0.0.0.0
      - API_PORT=8000
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - OLLAMA_MODEL=${OLLAMA_MODEL:-gemma3:4b}
      - OLLAMA_BASE_URL=http://ollama:11434
      - OLLAMA_TIMEOUT=${OLLAMA_TIMEOUT:-300}
      - OLLAMA_CTX=${OLLAMA_CTX:-8192}
      - OLLAMA_NUM_PREDICT=${OLLAMA_NUM_PREDICT:-1024}
      - LLM_MAX_TEXT_CHARS=${LLM_MAX_TEXT_CHARS}
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    restart: unless-stopped
    depends_on:
      - redis

  frontend:
    build: .
    container_name: grottocenter-ai-frontend
    command: streamlit run frontend/streamlit_app.py
    ports:
      - "8501:8501"
    volumes:
      - .:/app
    environment:
      - STREAMLIT_SERVER_PORT=8501
      - STREAMLIT_SERVER_ADDRESS=0.0.0.0
      - API_BASE_URL=http://backend:8000
    depends_on:
      - backend
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  worker:
    build: .
    container_name: grottocenter-ai-worker
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - OLLAMA_MODEL=${OLLAMA_MODEL:-gemma3:4b}
      - OLLAMA_BASE_URL=http://ollama:11434
      - OLLAMA_TIMEOUT=${OLLAMA_TIMEOUT:-300}
      - OLLAMA_CTX=${OLLAMA_CTX:-8192}
      - OLLAMA_NUM_PREDICT=${OLLAMA_NUM_PREDICT:-1024}
      - LLM_MAX_TEXT_CHARS=${LLM_MAX_TEXT_CHARS:-50000}
    command: celery -A backendV2.worker.tasks worker --loglevel=info
    volumes:
      - .:/app
    restart: unless-stopped
    depends_on:
      - redis

  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    environment:
      - OLLAMA_MODEL=${OLLAMA_MODEL:-gemma3:4b}
    gpus: all
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped
    entrypoint: |
      bash -c "
      ollama serve &
      sleep 5
      ollama pull ${OLLAMA_MODEL:-gemma3:4b}
      wait
      "


volumes:
  redis_data:
  ollama_data: