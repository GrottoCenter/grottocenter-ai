name: CI

on:
  pull_request:
  push:
    branches:
      - develop
      - feat/analyse-document
  # The deploy workflow runs the same checks before it ships anything.
  workflow_call:

permissions:
  contents: read

# In a called workflow, github.workflow is the caller's name. Including it keeps a run
# started by the deploy workflow from sharing a group with, and cancelling, the CI run
# that the same push starts on its own.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: AI_Serveur/requirements*.txt

      - name: Install dependencies
        run: pip install -r AI_Serveur/requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest --junitxml=reports/junit.xml

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-report
          path: reports/
          if-no-files-found: ignore
