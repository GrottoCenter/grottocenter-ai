services:
  backend:
    build: ./AI_Serveur
    container_name: grottocenter-ai-serveur
    environment:
      - API_HOST=0.0.0.0
      - API_PORT=8000
      - GREENPT_API_URL=https://api.greenpt.ai/v1
      - GREENPT_API_KEY=${GREENPT_API_KEY}
      - SSO_SALT_DOCUMENTS=${SSO_SALT_DOCUMENTS}
      - CORS_ORIGINS=http://localhost:3000,http://localhost:5173
      - LOG_LEVEL=${LOG_LEVEL:-DEBUG}
      - FORWARDED_ALLOW_IPS=${FORWARDED_ALLOW_IPS:-127.0.0.1}
      - MONGO_URI=mongodb://${MONGO_APP_USERNAME}:${MONGO_APP_PASSWORD}@mongodb:27017/${MONGO_DB_NAME}?authSource=${MONGO_DB_NAME}
      - MONGO_DB_NAME=${MONGO_DB_NAME}
      - MONGO_APP_USERNAME=${MONGO_APP_USERNAME}
      - MONGO_APP_PASSWORD=${MONGO_APP_PASSWORD}
    ports:
      - "8000:8000"
    volumes:
      - ./AI_Serveur:/app
    restart: unless-stopped
    depends_on:
      db-init:
        condition: service_completed_successfully

  db-init:
    build: ./AI_Serveur
    container_name: grottocenter-db-init
    environment:
      - MONGO_URI=mongodb://mongodb:27017
      - MONGO_DB_NAME=${MONGO_DB_NAME}
      - MONGO_ADMIN_USERNAME=${MONGO_ROOT_USERNAME}
      - MONGO_ADMIN_PASSWORD=${MONGO_ROOT_PASSWORD}
      - MONGO_APP_USERNAME=${MONGO_APP_USERNAME}
      - MONGO_APP_PASSWORD=${MONGO_APP_PASSWORD}
    command: ["python", "scripts/init_db.py"]
    depends_on:
      mongodb:
        condition: service_healthy
    restart: "no"

  mongodb:
    image: mongo:8.3.11
    container_name: grottocenter-mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval \"db.runCommand({ ping: 1 }).ok\" localhost:27017/test | grep 1"]
      interval: 15s
      timeout: 5s
      retries: 1

volumes:
  mongodb_data: